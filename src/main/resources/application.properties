spring.application.name=mentorship-platform

# H2 file DB (default profile for quick local/demo run + persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/mentorshipdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL setup (uncomment and configure for deployment)
# spring.datasource.url=jdbc:mysql://localhost:3306/mentorship_db
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
